# ============================================================================
# 教育教学 Agent（Kotlin + Compose）—— 冻结版本目录 v1.0
# 第 1 步原样落到 d:\agent\edu-agent-kt\gradle\libs.versions.toml，不得改版本号。
#
# 来源标注：
#   [G] = 取自 Google 官方脚手架 android/architecture-templates（multimodule 分支）
#   [V] = 2026-10-18 向 Maven Central / Google Maven 核实的稳定版
#   [K] = 需求硬指标「UI 库 / 微动作库 / 动画库」三类必选库（新增依赖必须登记）
# ============================================================================

[versions]
androidGradlePlugin = "9.4.1"          # [G] AGP 9.x 主线；升级前先跑官方 agp-9-upgrade 技能
kotlin = "2.4.20"                      # [G]
ksp = "2.3.12"                         # [G] Room / Hilt 注解处理统一走 KSP2
androidxComposeBom = "2026.09.00"      # [G] 用 BOM 管住所有 compose-* 版本
androidxCore = "1.19.1"                # [G]
androidxActivity = "1.13.0"            # [G]
androidxLifecycle = "2.11.0"           # [G]
nav3Core = "1.2.0"                     # [G]+[V] 已核实稳定（1.3.0-alpha02 存在，禁用）
androidxRoom = "2.8.5"                 # [G]+[V]
hilt = "2.60.1"                        # [G]+[V]
androidxHilt = "1.4.0"                 # [G]
coroutines = "1.11.0"                  # [G]
kotlinxSerializationCore = "1.11.0"    # [G]
junit = "4.13.2"                       # [G]
androidxTestCore = "1.7.0"             # [G]
androidxTestExt = "1.3.0"              # [G]
androidxTestRunner = "1.7.0"           # [G]

# --- 三类必选库（[K]）---
material3Adaptive = "1.3.0"            # [K][V] 已核实稳定（1.4.0 仅 alpha）
vico = "3.3.1"                         # [K][V] 图表：掌握度/提分曲线/进度
composeShimmer = "1.5.0"               # [K][V] 等待思考占位、骨架条
constraintlayoutCompose = "1.1.2"      # [K][V] MotionLayout：模式指示滑动等空间连续
lottie = "6.6.6"                       # [K][V] 选装：固化序列帧（对勾描边/掌握度环）

# --- 第三方（按需取用）[V] ---
retrofit = "3.0.0"
okhttp = "5.5.0"
coil = "3.6.3"
datastore = "1.2.1"
timber = "5.0.1"
chucker = "4.3.1"
leakcanary = "2.14"                    # [V] 3.0 仍是 alpha，禁用
detekt = "1.23.8"                      # [V] dev.detekt 2.x 仅 alpha，禁用
ktlint = "1.8.0"

[libraries]
# --- 三类必选库 [K] ---
androidx-compose-material3-adaptive = { module = "androidx.compose.material3.adaptive:adaptive", version.ref = "material3Adaptive" }
androidx-compose-material3-adaptive-layout = { module = "androidx.compose.material3.adaptive:adaptive-layout", version.ref = "material3Adaptive" }
vico-compose-m3 = { module = "com.patrykandpatrick.vico:compose-m3", version.ref = "vico" }
compose-shimmer = { module = "com.valentinilk.shimmer:compose-shimmer", version.ref = "composeShimmer" }
androidx-constraintlayout-compose = { module = "androidx.constraintlayout:constraintlayout-compose", version.ref = "constraintlayoutCompose" }
lottie-compose = { module = "com.airbnb.android:lottie-compose", version.ref = "lottie" }

# --- Compose（受 BOM 管版本，不写 version）[G] ---
androidx-compose-bom = { module = "androidx.compose:compose-bom", version.ref = "androidxComposeBom" }
androidx-compose-material3 = { module = "androidx.compose.material3:material3" }
androidx-compose-ui = { module = "androidx.compose.ui:ui" }
androidx-compose-ui-graphics = { module = "androidx.compose.ui:ui-graphics" }
androidx-compose-animation = { module = "androidx.compose.animation:animation" }
androidx-compose-ui-tooling = { module = "androidx.compose.ui:ui-tooling" }
androidx-compose-ui-tooling-preview = { module = "androidx.compose.ui:ui-tooling-preview" }
androidx-compose-ui-test-junit4 = { module = "androidx.compose.ui:ui-test-junit4" }
androidx-compose-ui-test-manifest = { module = "androidx.compose.ui:ui-test-manifest" }
androidx-compose-foundation = { module = "androidx.compose.foundation:foundation" }

# --- AndroidX 基础 [G] ---
androidx-core-ktx = { module = "androidx.core:core-ktx", version.ref = "androidxCore" }
androidx-activity-compose = { module = "androidx.activity:activity-compose", version.ref = "androidxActivity" }
androidx-lifecycle-runtime-ktx = { module = "androidx.lifecycle:lifecycle-runtime-ktx", version.ref = "androidxLifecycle" }
androidx-lifecycle-runtime-compose = { module = "androidx.lifecycle:lifecycle-runtime-compose", version.ref = "androidxLifecycle" }
androidx-lifecycle-viewmodel-compose = { module = "androidx.lifecycle:lifecycle-viewmodel-compose", version.ref = "androidxLifecycle" }

# --- 导航 Navigation 3 [G] ---
androidx-navigation3-runtime = { module = "androidx.navigation3:navigation3-runtime", version.ref = "nav3Core" }
androidx-navigation3-ui = { module = "androidx.navigation3:navigation3-ui", version.ref = "nav3Core" }
androidx-lifecycle-viewmodel-navigation3 = { module = "androidx.lifecycle:lifecycle-viewmodel-navigation3", version.ref = "androidxLifecycle" }

# --- Room（注意：Room 3.0.x 在新坐标 androidx.room3，本工程固定用 androidx.room 2.8.5）[G] ---
androidx-room-runtime = { module = "androidx.room:room-runtime", version.ref = "androidxRoom" }
androidx-room-ktx = { module = "androidx.room:room-ktx", version.ref = "androidxRoom" }
androidx-room-compiler = { module = "androidx.room:room-compiler", version.ref = "androidxRoom" }
androidx-room-testing = { module = "androidx.room:room-testing", version.ref = "androidxRoom" }

# --- Hilt [G] ---
hilt-android = { module = "com.google.dagger:hilt-android", version.ref = "hilt" }
hilt-compiler = { module = "com.google.dagger:hilt-compiler", version.ref = "hilt" }
hilt-android-testing = { module = "com.google.dagger:hilt-android-testing", version.ref = "hilt" }
androidx-hilt-lifecycle-viewmodel-compose = { module = "androidx.hilt:hilt-lifecycle-viewmodel-compose", version.ref = "androidxHilt" }

# --- 并发 / 序列化 [G] ---
kotlinx-coroutines-android = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-android", version.ref = "coroutines" }
kotlinx-coroutines-test = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-test", version.ref = "coroutines" }
kotlinx-serialization-json = { module = "org.jetbrains.kotlinx:kotlinx-serialization-json", version.ref = "kotlinxSerializationCore" }

# --- 测试 [G] ---
junit = { module = "junit:junit", version.ref = "junit" }
androidx-test-core = { module = "androidx.test:core", version.ref = "androidxTestCore" }
androidx-test-ext-junit = { module = "androidx.test.ext:junit", version.ref = "androidxTestExt" }
androidx-test-runner = { module = "androidx.test:runner", version.ref = "androidxTestRunner" }

# --- 网络 / 图片 / 存储 / 日志 [V] ---
retrofit = { module = "com.squareup.retrofit2:retrofit", version.ref = "retrofit" }
retrofit-kotlinx-serialization = { module = "com.squareup.retrofit2:converter-kotlinx-serialization", version.ref = "retrofit" }
okhttp = { module = "com.squareup.okhttp3:okhttp", version.ref = "okhttp" }
okhttp-logging = { module = "com.squareup.okhttp3:logging-interceptor", version.ref = "okhttp" }
coil-compose = { module = "io.coil-kt.coil3:coil-compose", version.ref = "coil" }
coil-network-okhttp = { module = "io.coil-kt.coil3:coil-network-okhttp", version.ref = "coil" }
androidx-datastore-preferences = { module = "androidx.datastore:datastore-preferences", version.ref = "datastore" }
timber = { module = "com.jakewharton.timber:timber", version.ref = "timber" }
chucker = { module = "com.github.chuckerteam.chucker:library", version.ref = "chucker" }
chucker-no-op = { module = "com.github.chuckerteam.chucker:library-no-op", version.ref = "chucker" }
leakcanary = { module = "com.squareup.leakcanary:leakcanary-android", version.ref = "leakcanary" }

[plugins]
android-application = { id = "com.android.application", version.ref = "androidGradlePlugin" }
android-library = { id = "com.android.library", version.ref = "androidGradlePlugin" }
android-test = { id = "com.android.test", version.ref = "androidGradlePlugin" }
compose-compiler = { id = "org.jetbrains.kotlin.plugin.compose", version.ref = "kotlin" }
kotlin-serialization = { id = "org.jetbrains.kotlin.plugin.serialization", version.ref = "kotlin" }
ksp = { id = "com.google.devtools.ksp", version.ref = "ksp" }
hilt-gradle = { id = "com.google.dagger.hilt.android", version.ref = "hilt" }
detekt = { id = "io.gitlab.arturbosch.detekt", version.ref = "detekt" }

# ---------------------------------------------------------------------------
# 三类库落地位置（契约 §2 / §8 / §9）
#   UI 库     : material3(BOM) + material3-adaptive + vico        → :core:design / :ui:parts
#   微动作库   : compose-shimmer + Compose 触觉 API(LocalHapticFeedback) → :core:design
#   动画库     : compose-animation(-core) + constraintlayout-compose(MotionLayout)
#               + lottie-compose(选装)                            → :core:design / :ui:parts
# 规则：任何新增依赖必须登记到本文件，并在 00-总纲 §二 的表格补一行，否则视为违规。
# ---------------------------------------------------------------------------
